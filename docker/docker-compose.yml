version: '3.8'  # Docker Compose 파일 형식 버전

services:
  app:
    build:
      context: ../               # 빌드 컨텍스트는 상위 디렉토리(cloudmailsvc) 전체
      dockerfile: docker/Dockerfile  # 사용할 Dockerfile 경로
    expose:
      - "5000"                   # 내부 컨테이너 포트 5000 노출 (외부 포트 연결 아님)

  nginx:
    image: nginx:latest          # 공식 nginx 이미지를 사용
    container_name: nginx        # 컨테이너 이름을 명시적으로 설정
    ports:
      - "80:80"                  # 호스트의 8080 포트를 컨테이너 80 포트에 매핑 (HTTP)
      - "443:443"                # 호스트의 443 포트를 컨테이너 443 포트에 매핑 (HTTPS)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf  # 로컬 nginx.conf를 nginx 설정으로 사용
      - certbot-etc:/etc/letsencrypt         # certbot이 발급한 인증서를 nginx에서 읽을 수 있도록 공유
      - certbot-www:/var/www/certbot         # certbot의 webroot 디렉토리 (challenge 응답 위치)
    depends_on:
      - app                     # app 서비스가 먼저 실행된 후 nginx 실행됨

  certbot:
    image: certbot/certbot      # Certbot 공식 이미지 사용
    container_name: certbot     # 컨테이너 이름 설정
    volumes:
      - certbot-etc:/etc/letsencrypt     # 발급된 인증서 저장 경로
      - certbot-www:/var/www/certbot     # 인증서 발급용 challenge 응답 경로
    entrypoint: >               # 기본 명령어를 override (초기 인증서 발급용 커맨드 실행)
      sh -c "certbot certonly --webroot --webroot-path=/var/www/certbot
             --email your-email@example.com --agree-tos --no-eff-email
             -d cloudmailsvc.com -d www.cloudmailsvc.com"
      # certbot을 webroot 방식으로 실행하여 인증서 발급
      # --email: 인증서 갱신 알림을 받을 이메일 주소
      # --agree-tos: 약관 동의
      # --no-eff-email: EFF 뉴스레터 수신 거절
      # -d: 도메인 목록

volumes:
  certbot-etc:    # 인증서가 저장될 볼륨 (nginx와 certbot이 공유)
  certbot-www:    # 인증서 발급용 challenge 응답 디렉터리 (nginx와 certbot이 공유)

################################################################################
# 사용 가이드
#
# 1. 도커 이미지 빌드 및 실행
# ------------------------------
# $ cd docker
# $ sudo docker-compose up --build
#
# 2. 초기 SSL 인증서 발급 (최초 1회만 실행)
# ----------------------------------------
# $ sudo docker-compose run --rm certbot
#
#    ▶ 이 명령어는 Let's Encrypt 인증서를 생성하며,
#      /etc/letsencrypt 경로에 저장됩니다.
#    ▶ 성공 후, nginx는 자동으로 해당 인증서를 사용하여 HTTPS 구동 가능
#
# 3. 인증서 자동 갱신 (선택)
# ------------------------------
# 아래 명령을 crontab 등에 등록:
# 0 0 * * * docker-compose run --rm certbot renew && docker-compose kill -s HUP nginx
#
# 4. 외부 사용자에게 공유할 경우
# ------------------------------
# - 이 docker-compose.yml 파일과 Dockerfile을 함께 배포
# - 외부 사용자는:
#   1. 도메인을 자신의 것으로 바꾸고,
#   2. 자신의 이메일로 설정 후,
#   3. 위의 명령대로 certbot을 실행
################################################################################
